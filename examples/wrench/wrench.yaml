# A steel combination wrench that tightens a nut, on the imported Gmsh mesh
# wrench.msh (see wrench.py for the description and make_wrench_mesh.py for
# the geometry).  The surfaces 'jaws' and 'grip' are physical groups of the
# mesh file.  Run with:  dualmesh run wrench.yaml
mesh:
  type: file
  filename: wrench.msh

problem:
  method: fem

variables:
  u: {}
  v: {}
  w: {}

materials:
  steel:
    type: linear_elastic_stress
    displacements: [u, v, w]
    formulation: three_dimensional
    youngs_modulus: 200.0e9
    poissons_ratio: 0.3

kernels:
  equilibrium_x: {type: stress_divergence, variable: u, component: 0}
  equilibrium_y: {type: stress_divergence, variable: v, component: 1}
  equilibrium_z: {type: stress_divergence, variable: w, component: 2}

boundary_conditions:
  # The nut holds the jaws: one condition per displacement component.
  jaws_u: {type: Dirichlet_boundary_condition, variable: u, boundary: jaws, value: 0.0}
  jaws_v: {type: Dirichlet_boundary_condition, variable: v, boundary: jaws, value: 0.0}
  jaws_w: {type: Dirichlet_boundary_condition, variable: w, boundary: jaws, value: 0.0}
  # The hand: 150 N in -y spread over the two grip faces (6e-4 m^2).  The
  # condition is named after the side set it acts on.
  grip: {type: traction_boundary_condition, variable: v, traction: -2.5e5}

executioner:
  type: steady

postprocessors:
  reaction_on_jaws: {type: total_reaction, variable: v, boundary: jaws}
  largest_deflection: {type: nodal_extreme_value, variable: v, value_type: min}

outputs:
  vtu: wrench.vtu
  postprocessor_csv: wrench_postprocessors.csv
