# Reddy, Example 5.4.3: a bus bar with internal heat generation, fixed
# temperatures on the sides, an insulated bottom, and convection on top.
mesh:
  type: rectangle
  x_min: 0.0
  x_max: 0.1
  y_min: 0.0
  y_max: 0.05
  num_x_elements: 10
  num_y_elements: 5

problem:
  method: dmcdm

variables:
  temperature: {initial_condition: 0.0}

kernels:
  conduction:
    type: heat_conduction
    variable: temperature
    thermal_conductivity: 20.0
  heating:
    type: heat_source
    variable: temperature
    heat_source: 1.0e6

boundary_conditions:
  left:
    type: Dirichlet_boundary_condition
    variable: temperature
    boundary: left
    value: 40.0
  right:
    type: Dirichlet_boundary_condition
    variable: temperature
    boundary: right
    value: 10.0
  top:
    type: convective_heat_flux_boundary_condition
    variable: temperature
    boundary: top
    heat_transfer_coefficient: 75.0
    ambient_temperature: 0.0

executioner:
  type: steady

postprocessors:
  heat_through_left:  {type: total_reaction, variable: temperature, boundary: left}
  heat_through_right: {type: total_reaction, variable: temperature, boundary: right}
  temperature_bottom: {type: point_value, variable: temperature, point: [0.05, 0.0]}
  temperature_top:    {type: point_value, variable: temperature, point: [0.05, 0.05]}
  hottest:            {type: nodal_extreme_value, variable: temperature, value_type: max}

outputs:
  vtu: bus_bar.vtu
  postprocessor_csv: bus_bar_postprocessors.csv
