# Uncertainty of the bus bar of Reddy's Example 5.4.3 (bus_bar.yaml): the
# conductivity, the heat source and the convection coefficient are uncertain,
# and the hottest temperature and the heat through the left side follow.
# The same study in Python is examples/bus_bar_uq.py.
uq:
  study: propagate
  model: bus_bar.yaml
  inputs:
    conductivity:
      distribution: normal
      mean: 20.0
      std: 1.0
      parameter: kernels/conduction/thermal_conductivity
    heat_source:
      distribution: normal
      mean: 1.0
      std: 0.05
      parameter: kernels/heating/heat_source
      apply: factor
    convection:
      distribution: log_normal
      median: 75.0
      factor: 2.0
      parameter: boundary_conditions/top/heat_transfer_coefficient
  outputs: [hottest, heat_through_left]
  samples: 64
  method: latin_hypercube
  seed: 1
  results: bus_bar_uq.json
