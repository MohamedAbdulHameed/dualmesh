name: CI

# Started by hand only (Actions > CI > Run workflow).
on:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A push runs on Linux only. A manual run adds macOS, whose minutes cost 10 times more. PETSc has no native Windows build; Windows runs under WSL.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    defaults:
      run:
        # On failure, the end of the output becomes an annotation that can be read without signing in.
        shell: bash .github/scripts/run-step.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUALMESH_BUILD_PYTHON=OFF
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  mpi:
    name: MPI (1, 2, 3 and 4 processes)
    runs-on: ubuntu-latest
    defaults:
      run:
        # On failure, the end of the output becomes an annotation that can be read without signing in.
        shell: bash .github/scripts/run-step.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUALMESH_BUILD_PYTHON=OFF
      - name: Build
        run: cmake --build build -j
      - name: Distributed tests
        run: |
          for n in 1 2 3 4; do
            mpirun --oversubscribe -n $n ./build/dualmesh_parallel_tests
          done

  petsc:
    name: PETSc and MPI (Python, 1 to 4 processes)
    runs-on: ubuntu-latest
    defaults:
      run:
        # On failure, the end of the output becomes an annotation that can be read without signing in.
        shell: bash .github/scripts/run-step.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dualmesh with MPI and PETSc
        run: |
          pip install .[all,test]
          python -c "import dualmesh; print(dualmesh.petsc_version())"
      - name: Serial PETSc tests
        run: pytest -q tests/python/test_PETSc.py tests/python/test_pressure_velocity.py
      - name: Distributed tests
        run: |
          for n in 1 2 3 4; do
            mpirun --oversubscribe -n $n python -m pytest -q -p no:cacheprovider tests/python/test_parallel.py
          done

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A push runs on Linux only. A manual run adds macOS.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        # A push tests 3.12. A manual run adds the oldest supported version, 3.11.
        python-version: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}
    defaults:
      run:
        # On failure, the end of the output becomes an annotation that can be read without signing in.
        shell: bash .github/scripts/run-step.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .[all,test]
      - name: Verification suite
        run: pytest -q
      - name: Examples
        run: |
          python examples/cooling_fin.py
          python examples/large_deformation_bar.py
          python examples/lid_driven_cavity.py
          python examples/plate_with_hole/plate_with_hole.py
          python examples/transient_slab.py
          python examples/natural_convection/natural_convection.py
          python examples/reactor_criticality.py
          python examples/wrench/wrench.py
      - name: Command line
        run: |
          dualmesh --version
          dualmesh list --module heat_transfer
          dualmesh describe heat_conduction
          dualmesh list --category physics
          dualmesh describe solid_mechanics
          dualmesh mesh examples/wrench/wrench.msh
          cd examples && python bus_bar.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install ruff==0.16.10
      - name: Ruff
        run: ruff check python tests examples
      - name: clang-format
        run: |
          # One pinned version, so that the result does not depend on the runner image.
          pip install clang-format==18.1.8
          find include src python/bindings tests/cpp -name '*.h' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install .[docs,all]
      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html
      - name: Names of the public interface
        run: python scripts/audit_names.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation
          path: docs/_build/html

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    defaults:
      run:
        # On failure, the end of the output becomes an annotation that can be read without signing in.
        shell: bash .github/scripts/run-step.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: python -m pip install pybind11 numpy pyyaml scipy sympy meshio pytest
      - name: Configure with the sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" -Dpybind11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
      - name: Build
        run: cmake --build build -j
      # Open MPI patches malloc and mmap through its memory hooks and UCX, which AddressSanitizer
      # intercepts as well: the two together crash at start-up, so the sanitized runs leave them
      # out and use the shared-memory transport.
      - name: C++ tests
        env:
          OMPI_MCA_memory: ^patcher
          OMPI_MCA_pml: ob1
          OMPI_MCA_btl: self,vader
        run: ctest --test-dir build --output-on-failure
      - name: Python tests of the core, the physics and the neutronics
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          OMPI_MCA_memory: ^patcher
          OMPI_MCA_pml: ob1
          OMPI_MCA_btl: self,vader
        run: |
          export LD_PRELOAD=$(gcc -print-file-name=libasan.so):$(gcc -print-file-name=libubsan.so)
          PYTHONPATH=$PWD/python python -m pytest tests/python/test_framework.py tests/python/test_physics.py tests/python/test_Jacobian.py tests/python/test_criticality.py tests/python/test_eigenvalue_study.py -q

  coverage:
    name: Coverage of the C++ and the Python code
    runs-on: ubuntu-latest
    defaults:
      run:
        # On failure, the end of the output becomes an annotation that can be read without signing in.
        shell: bash .github/scripts/run-step.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: python -m pip install pybind11 numpy pyyaml scipy sympy meshio pytest pytest-cov gcovr
      - name: Configure with coverage
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -Dpybind11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
      - name: Build
        run: cmake --build build -j
      - name: Tests
        run: |
          ctest --test-dir build --output-on-failure
          PYTHONPATH=$PWD/python python -m pytest tests/python -q --cov=python/dualmesh --cov-report=xml:python-coverage.xml --cov-report=term
      - name: C++ coverage report
        # The innermost loops of the automatic differentiation run more than 2^32
        # times, which gcovr takes for the gcov overflow bug (GCC bug 68080) and
        # refuses; these counts are genuine, so gcovr only warns about them.
        run: >-
          gcovr --root . --filter src/ --filter include/ --xml cpp-coverage.xml
          --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file --print-summary build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            python-coverage.xml
            cpp-coverage.xml

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    defaults:
      run:
        # On failure, the end of the output becomes an annotation that can be read without signing in.
        shell: bash .github/scripts/run-step.sh {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
      - name: Install clang-tidy, Eigen and clang's OpenMP headers
        run: sudo apt-get update && sudo apt-get install -y clang-tidy libeigen3-dev libomp-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DDUALMESH_BUILD_PYTHON=OFF
      - name: clang-tidy on the library
        run: |
          status=0
          run-clang-tidy -p build -quiet "src/.*\.cpp" > tidy.log 2>&1 || status=$?
          cat tidy.log
          # The errors, then the number of warnings of each check, at the end of the output, where the annotation of a failure shows them.
          grep -E "error: " tidy.log | sort -u | head -40 || true
          grep -oE "warning: .*\[[a-z0-9.-]+\]$" tidy.log | sort -u | grep -oE "\[[a-z0-9.-]+\]$" | sort | uniq -c | sort -rn || true
          exit $status
