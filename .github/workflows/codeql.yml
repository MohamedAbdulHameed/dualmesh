name: CodeQL

# Started by hand only (Actions > CodeQL > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/petsc
        if: matrix.language == 'c-cpp'
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Build the library
        if: matrix.language == 'c-cpp'
        run: |
          cmake -S . -B build -DDUALMESH_BUILD_PYTHON=OFF && cmake --build build -j
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
