name: Performance

# A performance regression gate.  scripts/benchmark.py times one residual and
# Jacobian assembly of every method for three physics, and
# scripts/check_performance.py compares the times with budgets of about ten
# times the calibration machine: the gate catches a regression of an order of
# magnitude (the class that once made copying the whole derivative array of an
# ADReal the dominant cost of assembly), not a change of a few percent, which
# the noise of a shared runner would turn into false alarms.  It runs weekly
# and on demand; the results are kept as an artifact.
on:
  schedule:
    - cron: "23 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Assembly benchmarks against budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install pybind11 numpy
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUALMESH_BUILD_TESTS=OFF -Dpybind11_DIR=$(python -c "import pybind11; print(pybind11.get_cmake_dir())")
          cmake --build build -j
      - name: Run the benchmarks
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python scripts/benchmark.py --quick --only assembly --repeat 5 --output results.json
      - name: Check the budgets
        run: python scripts/check_performance.py results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-results
          path: results.json
