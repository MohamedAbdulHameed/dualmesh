version: 2

# The documentation imports the compiled package, so the build installs MPI and PETSc as the
# Linux jobs of the continuous integration do (.github/actions/petsc/action.yml).
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - cmake
    - pkg-config
    - libeigen3-dev
    - libopenmpi-dev
    - openmpi-bin
    - libpetsc-real-dev
  jobs:
    post_checkout:
      - git fetch --unshallow || true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - all

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - htmlzip
