version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - cmake
    - libeigen3-dev
  jobs:
    post_checkout:
      - git fetch --unshallow || true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
        - all

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - pdf
  - htmlzip
