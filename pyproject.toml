[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "dualmesh-multiphysics"
version = "0.2.0"
description = "A multiphysics framework for heat transfer, solid mechanics and fluid dynamics, by finite elements, finite volumes and the dual mesh control domain method"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-2.1-or-later" }
authors = [{ name = "Mohamed AbdulHameed" }]
keywords = [
  "dual mesh control domain method",
  "DMCDM",
  "finite element method",
  "finite volume method",
  "fluid dynamics",
  "solid mechanics",
  "heat transfer",
  "multiphysics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
mesh = ["meshio>=5.0"]
plot = ["matplotlib>=3.5"]
mms = ["sympy>=1.9"]
linalg = ["scipy>=1.7"]
docs = ["sphinx>=7.0", "furo", "myst-parser", "sphinx-copybutton"]
test = ["pytest>=7.0", "meshio>=5.0", "sympy>=1.9", "scipy>=1.7"]
all = ["meshio>=5.0", "matplotlib>=3.5", "sympy>=1.9", "scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/MohamedAbdulHameed/dualmesh"
Documentation = "https://dualmesh.readthedocs.io"
Repository = "https://github.com/MohamedAbdulHameed/dualmesh"
Issues = "https://github.com/MohamedAbdulHameed/dualmesh/issues"

[project.scripts]
dualmesh = "dualmesh.cli:main"

[tool.scikit-build]
wheel.packages = ["python/dualmesh"]
cmake.version = ">=3.18"
cmake.args = ["-DDUALMESH_BUILD_TESTS=OFF"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
# One statement is written on one line, however long: the formatter joins a
# call, a definition or a literal onto a single line up to the largest length
# ruff accepts, and the length check is off.
line-length = 320
target-version = "py39"

[tool.ruff.format]
skip-magic-trailing-comma = true
docstring-code-format = true
docstring-code-line-length = 320

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
  "N803",  # argument names such as A, B, D are the standard symbols
  "N806",
  "C408",  # dict(key=value) reads better than a literal for parameter sets
  "E501",  # statements are kept on one line (see line-length above)
  "SIM108",  # an if-else block stays a block where a ternary would be long
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
